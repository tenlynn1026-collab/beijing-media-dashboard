<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京中心媒体合作情况大屏</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --line: #e5e9f0;
    --txt: #1f2937; --sub: #6b7280; --blue: #2563eb; --blue-l: #eff6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--txt); padding: 24px; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between;
           flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 700; }
  h1 small { font-size: 12px; color: var(--sub); font-weight: 400; margin-left: 10px; }
  #q { width: 340px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px;
       font-size: 14px; outline: none; background: var(--card); }
  #q:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .errbar { display: none; background: #fee2e2; color: #991b1b; border: 1px solid #fecaca;
            border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .kpi .lab { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .kpi .val { font-size: 26px; font-weight: 700; color: var(--blue); }
  .kpi .val span { font-size: 13px; color: var(--sub); font-weight: 400; margin-left: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: var(--txt); }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 12px; }
  .bar-row .name { width: 110px; flex-shrink: 0; color: var(--sub); text-align: right;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .track { flex: 1; background: var(--blue-l); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--blue); border-radius: 4px; min-width: 2px; }
  .bar-row .num { width: 90px; flex-shrink: 0; color: var(--txt); font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th { position: sticky; top: 0; background: var(--card); text-align: left; padding: 9px 10px;
             color: var(--sub); font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:hover { background: var(--blue-l); }
  .tbl-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
              max-height: 560px; overflow: auto; }
  .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; white-space: nowrap; }
  .b-wait { background: #fef3c7; color: #92400e; }
  .b-ok   { background: #dcfce7; color: #166534; }
  .b-pre  { background: #e0e7ff; color: #3730a3; }
  .b-other{ background: #f3f4f6; color: #4b5563; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  footer { margin-top: 16px; font-size: 12px; color: var(--sub); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>北京中心媒体合作情况大屏<small>数据源：在线台账数据库 ｜ 实时读取</small></h1>
    <input id="q" placeholder="搜索：媒体 / 项目 / 标题 / 预算来源…">
  </header>

  <div class="errbar" id="errbar">数据加载失败，请稍后刷新重试。</div>

  <div class="kpis">
    <div class="kpi"><div class="lab">投放总额</div><div class="val" id="k-total">-</div></div>
    <div class="kpi"><div class="lab">投放笔数</div><div class="val" id="k-cnt">-</div></div>
    <div class="kpi"><div class="lab">覆盖媒体</div><div class="val" id="k-media">-</div></div>
    <div class="kpi"><div class="lab">覆盖月份</div><div class="val" id="k-month">-</div></div>
  </div>

  <div class="grid2">
    <div class="card"><h3>按媒体类型（金额）</h3><div id="chart-type"></div></div>
    <div class="card"><h3>按结算月份（金额）</h3><div id="chart-month"></div></div>
  </div>
  <div class="card" style="margin-bottom:16px"><h3>媒体 TOP10（按金额）</h3><div id="chart-top"></div></div>

  <div class="tbl-card">
    <table>
      <thead><tr>
        <th>编号</th><th>媒体名称</th><th>类型</th><th>所属项目</th><th>预算来源</th>
        <th>总金额</th><th>状态</th><th>结算月份</th><th>稿件/备注</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <footer>口径：同链接不同金额=拆单分别入账；重复记录已按裁决剔除（见台账"剔除重复记录"页）</footer>
</div>

<script>
const wan = v => (v / 10000).toLocaleString("zh-CN", {maximumFractionDigits: 1});
const fmt = v => v.toLocaleString("zh-CN", {maximumFractionDigits: 0});

function badge(s) {
  if (!s) return '<span class="badge b-other">未标注</span>';
  if (s.includes("待") || s.includes("未")) return `<span class="badge b-wait">${s}</span>`;
  if (s.includes("预提") || s.includes("已签约")) return `<span class="badge b-pre">${s}</span>`;
  if (s.includes("已结项") || s.includes("已支付")) return `<span class="badge b-ok">${s}</span>`;
  return `<span class="badge b-other">${s}</span>`;
}

function bars(el, data) {
  const max = Math.max(...data.map(d => d[1]), 1);
  el.innerHTML = data.map(([n, v, c]) => `
    <div class="bar-row">
      <div class="name" title="${n}">${n}</div>
      <div class="track"><div class="fill" style="width:${(v / max * 100).toFixed(1)}%"></div></div>
      <div class="num">${wan(v)}万${c ? ` · ${c}笔` : ""}</div>
    </div>`).join("");
}

function group(list, key) {
  const m = {};
  list.forEach(r => {
    const k = r[key] || "未标注";
    (m[k] = m[k] || [0, 0]);
    m[k][0] += r.amount; m[k][1] += 1;
  });
  return m;
}

function render(list) {
  const total = list.reduce((s, r) => s + r.amount, 0);
  document.getElementById("k-total").innerHTML = `${wan(total)}<span>万元</span>`;
  document.getElementById("k-cnt").innerHTML = `${list.length}<span>笔</span>`;
  document.getElementById("k-media").innerHTML = `${new Set(list.map(r => r.media)).size}<span>家</span>`;
  document.getElementById("k-month").innerHTML = `${new Set(list.map(r => r.month)).size}<span>个</span>`;

  const byType = Object.entries(group(list, "type")).sort((a, b) => b[1][0] - a[1][0]);
  bars(document.getElementById("chart-type"), byType.map(([k, v]) => [k, v[0], v[1]]));
  const byMonth = Object.entries(group(list, "month")).sort((a, b) => a[0].localeCompare(b[0]));
  bars(document.getElementById("chart-month"), byMonth.map(([k, v]) => [k, v[0], v[1]]));
  const byMedia = Object.entries(group(list, "media")).sort((a, b) => b[1][0] - a[1][0]).slice(0, 10);
  bars(document.getElementById("chart-top"), byMedia.map(([k, v]) => [k, v[0], v[1]]));

  const tb = document.getElementById("tbody");
  if (!list.length) { tb.innerHTML = '<tr><td colspan="9"><div class="empty">没有匹配的记录</div></td></tr>'; return; }
  tb.innerHTML = list.map(r => `<tr>
    <td>${r.id}</td>
    <td>${r.media || ""}</td>
    <td>${r.type || ""}</td>
    <td>${r.project || ""}</td>
    <td>${r.budget || ""}</td>
    <td class="amt">${fmt(r.amount)}</td>
    <td>${badge(r.status)}</td>
    <td>${r.month || ""}</td>
    <td>${r.link ? `<a href="${r.link}" target="_blank" rel="noopener">链接↗</a> ` : ""}${r.title || ""}</td>
  </tr>`).join("");
}

let LEDGER = [];
const input = document.getElementById("q");
function apply() {
  const q = input.value.trim().toLowerCase();
  const list = !q ? LEDGER : LEDGER.filter(r =>
    [r.media, r.project, r.title, r.budget, r.type, r.month, r.src].some(v => v && String(v).toLowerCase().includes(q)));
  render(list);
}
input.addEventListener("input", apply);

// 从在线台账数据库动态加载数据
async function load() {
  try {
    const res = await fetch("/api/ledger");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    LEDGER = await res.json();
    apply();
  } catch (err) {
    console.error("数据加载失败:", err);
    document.getElementById("errbar").style.display = "block";
  }
}
load();
</script>
</body>
</html>
